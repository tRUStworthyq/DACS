services:
  keycloak-db:
    image: postgres:18-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      # ВАЖНО: начиная с Postgres 18 монтируем родительскую директорию,
      # а не /var/lib/postgresql/data — иначе контейнер не стартует
      - keycloak_db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_MANAGEMENT_PORT: "9000"

      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/key.pem
      KC_HTTP_MANAGEMENT_SCHEME: "http"
    volumes:
      - ./keycloak/certs:/opt/keycloak/certs:ro
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9000:9000"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - keycloak-net

  gateway:
    build:
      context: ../gateway
      dockerfile: deploy/Dockerfile
    container_name: gateway
    environment:
      KEYCLOAK_SCHEME: https # http
      KEYCLOAK_PORT: "8443" # 8080
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: "dev-client-secret-local-only"
      CORE_BASE_URL: http://core:8082
    ports:
      - "8765:8765"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net

  core-db:
    image: postgres:18-alpine
    container_name: core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core_pass
    volumes:
      - core_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U core -d core" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-net

  core:
    build:
      context: ../core
      dockerfile: deploy/Dockerfile
    container_name: core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/core
      SPRING_DATASOURCE_USERNAME: core
      SPRING_DATASOURCE_PASSWORD: core_pass
      DB_HOST: core-db
      DB_PORT: "5432"
      DB_NAME: core
      DB_USERNAME: core
      DB_PASSWORD: core_pass
      KEYCLOAK_SCHEME: https # http
      KEYCLOAK_PORT: "8443" # 8080
    ports:
      - "8082:8082"
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - keycloak-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Фиксированный cluster id (формат base64 UUID)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - keycloak-net


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-kraft"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - keycloak-net

volumes:
  keycloak_db_data:
  core_db_data:
  kafka_data:

networks:
  keycloak-net:
    driver: bridge