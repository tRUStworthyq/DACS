services:
  keycloak-db:
    image: postgres:18-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      # ВАЖНО: начиная с Postgres 18 монтируем родительскую директорию,
      # а не /var/lib/postgresql/data — иначе контейнер не стартует
      - keycloak_db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/key.pem
    volumes:
      - ./keycloak/certs:/opt/keycloak/certs:ro
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - keycloak-net

  gateway:
    build:
      context: ../gateway
      dockerfile: deploy/Dockerfile
    container_name: gateway
    environment:
      KEYCLOAK_SCHEME: https # http
      KEYCLOAK_PORT: "8443" # 8080
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: "dev-client-secret-local-only"
      CORE_BASE_URL: http://core:8082
    ports:
      - "8765:8765"
    depends_on:
      - keycloak
    networks:
      - keycloak-net

  core-db:
    image: postgres:18-alpine
    container_name: core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core_pass
    volumes:
      - core_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U core -d core" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-net

  core:
    build:
      context: ../core
      dockerfile: deploy/Dockerfile
    container_name: core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/core
      SPRING_DATASOURCE_USERNAME: core
      SPRING_DATASOURCE_PASSWORD: core_pass
      KEYCLOAK_SCHEME: https # http
      KEYCLOAK_PORT: "8443" # 8080
    ports:
      - "8082:8082"
    depends_on:
      - keycloak
    networks:
      - keycloak-net

volumes:
  keycloak_db_data:
  core_db_data:

networks:
  keycloak-net:
    driver: bridge